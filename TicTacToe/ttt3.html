<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        .square {
            display: flex;
            flex-direction: row;
            border: 2px;
            border-color: black;
            border-style: solid;
            text-align: center;
            font-size: 60px;
            font-family: Arial, Helvetica, sans-serif;
            align-items: center;
            justify-content: center;
        }

        .square:hover {
            background-color: antiquewhite;
        }


        .squares {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            align-self: center;
            /* margin-top: 40px; */
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .section {
            width: 400px;
            height: 40px;
            border: 2px;
            border-style: solid;
            border-color: black;
            margin-bottom: 20px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 25px;
            text-align: center;
        }

        #winner {
            margin-top: 20px;
        }

        #start {
            width: 100px;
            /* align-self: center; */
            font-size: 20px;
            margin-left: 105px;
            margin-top: 10px;
        }


    </style>
</head>
<body>
    <h1>Tic Tac Go!</h1>
    <div class="section" id="turn">
        <h2></h2>
    </div>
    <div class="squares">
        <script>
            startingPlayerKey = Math.random();
            currPlayer = '';
            if (startingPlayerKey < 0.5) {
                currPlayer = 'X';
            }
            else {
                currPlayer = 'O';
            }
            const turnBar = document.getElementById("turn");
            turnBar.textContent = "Player " + currPlayer + "'s " + "turn";
            function boxClicked(event, boxNum, currPlayer) {
                event.target.textContent = currPlayer;
                alert("square " + boxNum);
            }
            const NUM_SQUARES = 9;
            for (i=0; i<NUM_SQUARES; i++) {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
            }
            for (let i = 0; i < NUM_SQUARES; i++) {
                const box = document.getElementById("sq" + i);
                box.addEventListener("click", function(event) {
                    if (box.textContent == '') {
                        boxClicked(event, i, currPlayer);
                        if (currPlayer == 'X') {
                            currPlayer = 'O';
                        }
                        else {
                            currPlayer = 'X';
                        }
                        turnBar.textContent = "Player " + currPlayer + "'s " + "turn";
                    }
                });
            }

            document.write( "<button id='start'>Start Game</button>" );
            const startButton = document.getElementById("start");
            startButton.addEventListener("click", function() {
                location.reload();
                playerKey = Math.random();
                if (playerKey < 0.5) {
                currPlayer = 'X';
                }
                else {
                    currPlayer = 'O';
                }
            });

        </script>
    </div>
    <div class="section" id="winner">
        <h2></h2>
    </div>
    
</body>
</html>
