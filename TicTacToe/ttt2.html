<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        .square {
            display: flex;
            flex-direction: row;
            /* height: 100px;
            width: 100px; */
            /* margin-bottom: 5px;
            margin-right: 5px; */
            border: 2px;
            border-color: black;
            border-style: solid;
            text-align: center;
            font-size: 60px;
            font-family: Arial, Helvetica, sans-serif;
            align-items: center;
            justify-content: center;
        }

        .square:hover {
            background-color: antiquewhite;
        }


        .squares {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            align-self: center;
            /* margin-top: 40px; */
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .section {
            width: 400px;
            height: 40px;
            border: 2px;
            border-style: solid;
            border-color: black;
            margin-bottom: 20px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 25px;
            text-align: center;
        }

        #winner {
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <h1>Tic Tac Go!</h1>
    <div class="section" id="turn">
        <h2></h2>
    </div>
    <div class="squares">
        <script>
            const NUM_SQUARES = 9;
            for (i=0; i<NUM_SQUARES; i++) {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
            }
            const box3 = document.getElementById("sq2");
            box3.textContent = "X";
            const box4 = document.getElementById("sq3");
            box4.textContent = "O";
        </script>
    </div>
    <div class="section" id="winner">
        <h2></h2>
    </div>
    
</body>
</html>
